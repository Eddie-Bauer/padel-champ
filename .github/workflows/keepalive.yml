name: Supabase keep-alive

# The Supabase free plan pauses a project after about a week without
# database activity. This makes one small database request twice a week.
# If it fails, the run fails and GitHub sends an email.

on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

env:
  SB_URL: https://yldwlgeabmwdjefeerpr.supabase.co
  # The publishable key, already shipped in the page. Not a secret.
  SB_KEY: sb_publishable_mrL1kVUYLjoiyKJMtJ20KA_ZRelO6BC

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row
        run: |
          curl --fail --silent --show-error --max-time 30 --output /dev/null \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
            "$SB_URL/rest/v1/settings?select=id&limit=1"
