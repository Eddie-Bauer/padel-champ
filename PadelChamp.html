<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="PadelChamp"/>
<title>PadelChamp</title>
<script>
try{document.documentElement.dataset.theme=localStorage.getItem('pc_theme')==='dark'?'dark':'light';}catch(e){}
</script>
<link rel="stylesheet" href="ds/tokens.css"/>
<link rel="stylesheet" href="ds/bundle.css"/>
<link rel="stylesheet" href="css/app.css"/>
</head>
<body class="pc-app">
<div id="root" class="app">
  <div id="banner" class="pc-banner" hidden></div>
  <main id="screen" class="app-screen"></main>
  <div class="pc-tabbar-wrap">
    <nav class="pc-tabbar" id="nav" aria-label="Hauptnavigation">
      <button class="pc-tab" data-tab="start"><svg class="pc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Start</button>
      <button class="pc-tab pc-edit-only" data-tab="events"><svg class="pc-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Events</button>
      <button class="pc-fab pc-edit-only" id="fab" aria-label="Neues Event"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="pc-tab" data-tab="standings"><svg class="pc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 16.5V21M7 3.5h10V9a5 5 0 0 1-10 0z"/><path d="M17 5h3v1.5A3.5 3.5 0 0 1 16.6 10M7 5H4v1.5A3.5 3.5 0 0 0 7.4 10"/></svg>Rangliste</button>
      <button class="pc-tab pc-edit-only" data-tab="players"><svg class="pc-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/></svg>Spieler</button>
    </nav>
  </div>
</div>

<script>
if(location.protocol==='file:'){document.getElementById('screen').textContent='Diese App muss über ihre Web-Adresse geöffnet werden, nicht als Datei.';}
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
